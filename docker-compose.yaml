# Production deployment uses explicit host bind mounts under /data/liferadar.
# Local development should use docker-compose.local.yaml instead.

services:
  liferadar-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: liferadar-api
    environment:
      LIFERADAR_DB_HOST: "${LIFERADAR_DB_HOST}"
      LIFERADAR_DB_PORT: "${LIFERADAR_DB_PORT}"
      LIFERADAR_DB_NAME: "${LIFERADAR_DB_NAME}"
      LIFERADAR_DB_USER: "${LIFERADAR_DB_USER}"
      LIFERADAR_DB_PASSWORD: "${LIFERADAR_DB_PASSWORD}"
      LIFERADAR_API_KEY: "${LIFERADAR_API_KEY}"
      LIFERADAR_MATRIX_BRIDGE_URL: http://liferadar-matrix-bridge:8010
      LIFERADAR_CHAT_GATEWAY_URL: http://liferadar-chat-gateway:8020
      LIFERADAR_MATRIX_ENABLED: "${LIFERADAR_MATRIX_ENABLED:-true}"
      LIFERADAR_MATRIX_HOMESERVER_URL: "${LIFERADAR_MATRIX_HOMESERVER_URL:-}"
      MATRIX_RUST_SESSION_PATH: "${MATRIX_RUST_SESSION_PATH:-/app/identity/matrix-session.json}"
      MATRIX_RUST_STORE: "${MATRIX_RUST_STORE:-/app/identity/matrix-rust-sdk-store}"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/identity:/app/identity
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.liferadar-compose-api.rule=Host(`liferadar.nothing.pink`)"
      - "traefik.http.routers.liferadar-compose-api.entrypoints=https"
      - "traefik.http.routers.liferadar-compose-api.tls=true"
      - "traefik.http.routers.liferadar-compose-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.liferadar-compose-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=coolify"
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  liferadar-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: liferadar-mcp
    environment:
      LIFERADAR_DB_HOST: "${LIFERADAR_DB_HOST}"
      LIFERADAR_DB_PORT: "${LIFERADAR_DB_PORT}"
      LIFERADAR_DB_NAME: "${LIFERADAR_DB_NAME}"
      LIFERADAR_DB_USER: "${LIFERADAR_DB_USER}"
      LIFERADAR_DB_PASSWORD: "${LIFERADAR_DB_PASSWORD}"
      LIFERADAR_API_URL: http://liferadar-api:8000
      LIFERADAR_PUBLIC_API_URL: "${LIFERADAR_PUBLIC_API_URL}"
      LIFERADAR_API_KEY: "${LIFERADAR_API_KEY}"
      OUTLOOK_MCP_ENABLED: "${OUTLOOK_MCP_ENABLED}"
      MSGRAPH_CLIENT_ID: "${MSGRAPH_CLIENT_ID}"
      MSGRAPH_CLIENT_SECRET: "${MSGRAPH_CLIENT_SECRET}"
      MSGRAPH_TENANT_ID: "${MSGRAPH_TENANT_ID}"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/outlook-token-cache:/app/outlook-token-cache
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - liferadar-api
      - liferadar-chat-gateway

  liferadar-worker:
    build:
      context: .
      dockerfile: Dockerfile.matrix-services
      target: worker-runtime
    container_name: liferadar-worker
    environment:
      LIFERADAR_DB_HOST: "${LIFERADAR_DB_HOST}"
      LIFERADAR_DB_PORT: "${LIFERADAR_DB_PORT}"
      LIFERADAR_DB_NAME: "${LIFERADAR_DB_NAME}"
      LIFERADAR_DB_USER: "${LIFERADAR_DB_USER}"
      LIFERADAR_DB_PASSWORD: "${LIFERADAR_DB_PASSWORD}"
      MATRIX_SESSION_PATH: "${MATRIX_SESSION_PATH}"
      MATRIX_RUST_SESSION_PATH: "${MATRIX_RUST_SESSION_PATH}"
      MATRIX_RUST_STORE: "${MATRIX_RUST_STORE}"
      MATRIX_ROOM_KEYS_PATH: "${MATRIX_ROOM_KEYS_PATH}"
      MATRIX_ROOM_KEYS_PASSPHRASE_PATH: "${MATRIX_ROOM_KEYS_PASSPHRASE_PATH}"
      MATRIX_RUST_KEY_IMPORT_MARKER: "${MATRIX_RUST_KEY_IMPORT_MARKER}"
      LIFERADAR_MATRIX_RUST_CANDIDATE_ID: "${LIFERADAR_MATRIX_RUST_CANDIDATE_ID}"
      LIFERADAR_MATRIX_RUST_CANDIDATE_TYPE: "${LIFERADAR_MATRIX_RUST_CANDIDATE_TYPE}"
      LIFERADAR_MATRIX_RUST_TIMEOUT_SEC: "${LIFERADAR_MATRIX_RUST_TIMEOUT_SEC}"
      LIFERADAR_MATRIX_RUST_RECOVER_HTTP_ON_FAILURE: "${LIFERADAR_MATRIX_RUST_RECOVER_HTTP_ON_FAILURE}"
      LIFERADAR_MATRIX_ENABLED: "${LIFERADAR_MATRIX_ENABLED:-true}"
      LIFERADAR_MATRIX_HOMESERVER_URL: "${LIFERADAR_MATRIX_HOMESERVER_URL}"
      MSGRAPH_CLIENT_ID: "${MSGRAPH_CLIENT_ID}"
      MSGRAPH_CLIENT_SECRET: "${MSGRAPH_CLIENT_SECRET}"
      MSGRAPH_TENANT_ID: "${MSGRAPH_TENANT_ID}"
      MSGRAPH_REFRESH_TOKEN: "${MSGRAPH_REFRESH_TOKEN}"
      GOOGLE_CALENDAR_CLIENT_ID: "${GOOGLE_CALENDAR_CLIENT_ID}"
      GOOGLE_CALENDAR_CLIENT_SECRET: "${GOOGLE_CALENDAR_CLIENT_SECRET}"
      GOOGLE_CALENDAR_REFRESH_TOKEN: "${GOOGLE_CALENDAR_REFRESH_TOKEN}"
      GOOGLE_CALENDAR_ID: "${GOOGLE_CALENDAR_ID}"
    expose:
      - "8080"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/identity:/app/identity
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/workspace:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coolify
    restart: unless-stopped

  liferadar-chat-gateway:
    build:
      context: .
      dockerfile: Dockerfile.chat-gateway
    container_name: liferadar-chat-gateway
    environment:
      LIFERADAR_DB_HOST: "${LIFERADAR_DB_HOST}"
      LIFERADAR_DB_PORT: "${LIFERADAR_DB_PORT}"
      LIFERADAR_DB_NAME: "${LIFERADAR_DB_NAME}"
      LIFERADAR_DB_USER: "${LIFERADAR_DB_USER}"
      LIFERADAR_DB_PASSWORD: "${LIFERADAR_DB_PASSWORD}"
      LIFERADAR_CONNECTOR_SESSION_DIR: /app/connectors
      LIFERADAR_CHAT_GATEWAY_PORT: 8020
      LIFERADAR_TELEGRAM_ENABLED: "${LIFERADAR_TELEGRAM_ENABLED}"
      LIFERADAR_WHATSAPP_ENABLED: "${LIFERADAR_WHATSAPP_ENABLED}"
      LIFERADAR_WHATSAPP_UNOFFICIAL_ALLOWED: "${LIFERADAR_WHATSAPP_UNOFFICIAL_ALLOWED}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      LIFERADAR_CONNECTOR_BACKFILL_LIMIT_PER_CHAT: "${LIFERADAR_CONNECTOR_BACKFILL_LIMIT_PER_CHAT}"
      LIFERADAR_SIGNAL_ENABLED: "${LIFERADAR_SIGNAL_ENABLED:-false}"
      LIFERADAR_SIGNAL_SIDECAR_URL: "${LIFERADAR_SIGNAL_SIDECAR_URL:-http://liferadar-signal-api:8080}"
      LIFERADAR_SIGNAL_PROXY_PORT: "${LIFERADAR_SIGNAL_PROXY_PORT:-8099}"
      LIFERADAR_SIGNAL_DEVICE_NAME: "${LIFERADAR_SIGNAL_DEVICE_NAME:-liferadar}"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/connectors:/app/connectors
    expose:
      - "8020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coolify
      - liferadar-signal-backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8020/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  liferadar-matrix-bridge:
    build:
      context: .
      dockerfile: Dockerfile.matrix-services
      target: matrix-bridge-runtime
    container_name: liferadar-matrix-bridge
    environment:
      LIFERADAR_DB_HOST: "${LIFERADAR_DB_HOST}"
      LIFERADAR_DB_PORT: "${LIFERADAR_DB_PORT}"
      LIFERADAR_DB_NAME: "${LIFERADAR_DB_NAME}"
      LIFERADAR_DB_USER: "${LIFERADAR_DB_USER}"
      LIFERADAR_DB_PASSWORD: "${LIFERADAR_DB_PASSWORD}"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/identity:/app/identity
    expose:
      - "8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Creates the sole Signal persistent-state directory before the unprivileged
  # sidecar starts. It has no network and exits after setting owner-only 0700.
  liferadar-signal-state-init:
    image: busybox:1.37.0
    container_name: liferadar-signal-state-init
    profiles: ["signal"]
    network_mode: "none"
    volumes:
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/connectors/signal:/signal-state
    command: ["sh", "-ec", "mkdir -p /signal-state && chown 1000:1000 /signal-state && chmod 700 /signal-state"]
    restart: "no"

  liferadar-signal-api:
    # signal-cli-rest-api sidecar backing the read-only Signal connector.
    #   * profile "signal": starts only on explicit opt-in
    #     (`COMPOSE_PROFILES=signal docker compose up -d`). Default `docker
    #     compose up` never pulls or runs it.
    #   * NO ports/published exposure and NO Traefik labels. It has no direct
    #     connection to the shared `coolify` network; only the gateway and the
    #     sidecar join the private `liferadar-signal-backend` network.
    #     A separate egress network lets only this sidecar reach Signal.
    #     The gateway's deny-by-default loopback proxy is the only caller.
    #   * The image has NO authentication and NO read-only mode, so it is
    #     never placed on a shared/public network segment.
    #   * Session keys persist under the existing durable
    #     <DATA_ROOT>/connectors bind mount (nested signal-cli config dir),
    #     surviving restarts and redeploys.
    image: bbernhard/signal-cli-rest-api:0.101
    container_name: liferadar-signal-api
    profiles: ["signal"]
    # The image runs s6-overlay under USER signal-api (uid 1000); pinning the
    # same uid here keeps the nested bind-mount owner deterministic so the
    # operator can `chmod 700` it on the host and still have the sidecar write
    # its session keys.
    user: "1000:1000"
    environment:
      MODE: json-rpc
      PORT: "8080"
      SIGNAL_CLI_CONFIG_DIR: /app/connectors/signal
      LOG_LEVEL: "${LIFERADAR_SIGNAL_LOG_LEVEL:-info}"
    volumes:
      # Sole Signal state mount, placed exactly at the requested path.
      - ${LIFERADAR_DATA_ROOT:-/data/liferadar}/connectors/signal:/app/connectors/signal
    depends_on:
      liferadar-signal-state-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - liferadar-signal-backend
      - liferadar-signal-egress
    restart: unless-stopped

networks:
  coolify:
    external: true
    name: coolify
  # Private gateway-to-sidecar link. The gateway has a separate coolify
  # interface; no other Coolify workload can reach this unauthenticated API.
  liferadar-signal-backend:
    internal: true
    name: liferadar-signal-backend
  # The sidecar needs outbound Signal connectivity. Only the sidecar joins this
  # network; its API port remains unexposed here.
  liferadar-signal-egress:
    name: liferadar-signal-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
